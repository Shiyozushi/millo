<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
const ov=document.getElementById('t'),tc=ov.getContext('2d');
function fit(){const d=window.devicePixelRatio||1,w=document.getElementById('w'),vw=innerWidth*d,vh=innerHeight*d;let s=Math.floor(Math.min(vw/W,vh/H));if(s<1)s=Math.min(vw/W,vh/H);w.style.width=(W*s/d)+'px';w.style.height=(H*s/d)+'px';ov.width=Math.max(1,Math.round(W*s));ov.height=Math.max(1,Math.round(H*s))}
const IM={};
const approach=(v,t,a)=>v<t?Math.min(v+a,t):Math.max(v-a,t);
const hs=(a,b)=>(((a*73856093)^(b*19349663))>>>0)%1000/1000;
// ---------- áudio ----------
const AU={muted:false,vm:5,vs:5};   // vm = volume da música, vs = volume dos efeitos (0 a 10, padrão 5)
try{const c=JSON.parse(localStorage.getItem('millo.cfg')||'{}');if(typeof c.vm==='number')AU.vm=c.vm;if(typeof c.vs==='number')AU.vs=c.vs}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('millo.cfg',JSON.stringify({vm:AU.vm,vs:AU.vs}))}catch(e){}};
const mv=b=>Math.min(1,(b||.35)*AU.vm/5);let actx=null,music=null;const bufs={};
const b64=u=>{const s=atob(u.split(',')[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer};
function audioInit(){
 if(actx){if(actx.state==='suspended')actx.resume();return}
 try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 for(const k of['jump','dash','level_complete','coin','morte'])actx.decodeAudioData(b64(AUD[k])).then(d=>bufs[k]=d).catch(()=>{});
 music=new Audio(AUD.background);music.loop=true;music.volume=mv();music.muted=AU.muted;
 music.onerror=()=>{actx.decodeAudioData(b64(AUD.background)).then(d=>{const s=actx.createBufferSource(),g=actx.createGain();s.buffer=d;s.loop=true;g.gain.value=AU.muted?0:mv();s.connect(g).connect(actx.destination);s.start();music={set volume(v){g.gain.value=AU.muted?0:v},set muted(v){g.gain.value=v?0:mv()}}}).catch(()=>{})};
 music.play().catch(()=>{});
}
function sfx(k,v=.7){if(!actx||AU.muted||!bufs[k])return;const s=actx.createBufferSource(),g=actx.createGain();s.buffer=bufs[k];g.gain.value=v*AU.vs/5;s.connect(g).connect(actx.destination);s.start()}
// ---------- input ----------
const keys={};let pressed={};
addEventListener('keydown',e=>{audioInit();if(typeof menuVideo==='function'&&mode==='title')menuVideo(true);if(/Space|Arrow/.test(e.code))e.preventDefault();if(!keys[e.code])pressed[e.code]=1;keys[e.code]=1});
addEventListener('keyup',e=>{keys[e.code]=0});
addEventListener('keydown',e=>{if(mode!=='name')return;if(e.key==='Backspace')nameBuf=nameBuf.slice(0,-1);else if(e.key==='Enter'&&nameBuf.trim())saveRun();else if(e.key.length===1&&/[\w \-áéíóúâêôãõçÁÉÍÓÚÂÊÔÃÕÇ]/.test(e.key)&&nameBuf.length<10)nameBuf+=e.key});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
const kL=()=>keys.KeyA||keys.ArrowLeft,kR=()=>keys.KeyD||keys.ArrowRight,kU=()=>keys.KeyW||keys.ArrowUp,kD=()=>keys.KeyS||keys.ArrowDown;
// ---------- fase (montada a partir de LEVEL, em data.js) ----------
const grid=Array.from({length:LH},()=>new Uint8Array(LW));
const fill=(x,y,w,h,v=1)=>{y+=DY;for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)grid[j][i]=v};
const statics=[],movers=[],spikes=[],decos=[],cps=[],items=[],orbs=[],frames=[];
LEVEL.fills.forEach(r=>fill(...r));
LEVEL.spikes.forEach(([x,y,n])=>{for(let i=0;i<n;i++)spikes.push({x:(x+i)*T,y:y*T,d:'U'})});

LEVEL.frames.forEach(([x,y,g])=>{frames.push({x:x*T,y:y*T,g});fill(x,y,3,3,2);grid[y+1][x+1]=0});
LEVEL.holes.forEach(([x,y])=>{grid[y][x]=1});
LEVEL.decos.forEach(d=>decos.push({n:d[0],x:d[1]*T,y:d[2]*T}));
LEVEL.coins.forEach((c,i)=>items.push({k:'Coin',x:c[0]*T,y:c[1]*T,id:'c'+i}));
LEVEL.checkpoints.forEach(c=>cps.push({x:c[0]*T,y:c[1]*T}));
LEVEL.orbs.forEach(o=>orbs.push({x:o[0]*T,y:o[1]*T,cd:0}));
const SPAWN0={x:LEVEL.spawn[0]*T,y:LEVEL.spawn[1]*T};
const CHEST={x:-999,y:-999};
const GATE={x:LEVEL.gate.x*T,y:-24,w:LEVEL.gate.w*T,h:24,on:true};
const NC=items.filter(i=>i.k==='Coin').length;
const CROWS=LEVEL.enemies.map(e=>[e[0],e[1]*T,e[2]*T]);

// ---------- jogador ----------
const p={x:0,y:0,w:9,h:13,vx:0,vy:0,rx:0,ry:0,face:1,sx:1,sy:1,runT:0};
let spawn={...SPAWN0},snap=new Set(),got=new Set(),mode='title',paused=false,dead=false,dT=0,deaths=0,time=0,tick=0,shake=0,ax=16,ay=30,cam={x:0,y:0};
let nameBuf='',finalMs=0,newIdx=-1,tsub='main',tsel=0,csel=0,selT=0,subT=0,menuConf=null,fadeA=0;const mOff=[0,0,0,0];const AN={},RK='matafechada.rank.v1';
const rank=()=>{try{return JSON.parse(localStorage.getItem(RK))||[]}catch(e){return[]}};
const fmt=ms=>Math.floor(ms/60000)+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')+'.'+String(Math.floor(ms/10)%100).padStart(2,'0');
function saveRun(){const r=rank(),e={n:nameBuf.trim(),t:finalMs};r.push(e);r.sort((a,b)=>a.t-b.t);r.length=Math.min(r.length,4);try{localStorage.setItem(RK,JSON.stringify(r));localStorage.setItem('matafechada.name',e.n)}catch(_){}newIdx=r.indexOf(e);mode='board'}
function finish(){sfx('level_complete',.9);if(music)music.volume=mv(.15);finalMs=Math.round(time*1000/60);const r=rank();if(r.length<4||finalMs<r[r.length-1].t){mode='name';try{nameBuf=localStorage.getItem('matafechada.name')||''}catch(_){nameBuf=''}}else{mode='board';newIdx=-1}}
let hp=3,inv=0,stun=0,atkCd=0,atkT=0,ekill=new Set(),eSnap=new Set();const bolts=[],torn=[],ens=[];
let cpFx=null,wcd=0,buf=0,coy=0,airJ=0,dashes=1,dashT=0,grab=false,gt=0,gside=0,lock=0,lastWall=0,lastWallT=0,jumping=false,cut=false,ground=false,dd={x:1,y:0};
const parts=[],trail=[],motes=Array.from({length:36},(_,i)=>({x:hs(i,1)*W,y:hs(i,2)*H,ph:hs(i,3)*6}));
const burst=(x,y,n,col,sp=1.6,l=24)=>{for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.3,l:l*(.5+Math.random()*.7),m:l,c:col,s:Math.random()<.4?2:1})}};
function overl(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function hit(x,y){const x0=Math.floor(x/T),x1=Math.floor((x+p.w-1)/T),y0=Math.floor(y/T),y1=Math.floor((y+p.h-1)/T);
 if(x0<0||x1>=LW)return true;
 for(let j=Math.max(y0,0);j<=y1&&j<LH;j++)for(let i=x0;i<=x1;i++)if(grid[j][i])return true;
 const r={x,y,w:p.w,h:p.h};if(GATE.on&&overl(r,GATE))return true;for(const s of statics)if(overl(r,s))return true;for(const s of movers)if(overl(r,s))return true;return false}
function mx(v){p.rx+=v;let m=Math.round(p.rx);p.rx-=m;const s=Math.sign(m);while(m){if(!hit(p.x+s,p.y)){p.x+=s;m-=s}else{p.vx=0;p.rx=0;break}}}
function my(v){p.ry+=v;let m=Math.round(p.ry);p.ry-=m;const s=Math.sign(m);while(m){if(!hit(p.x,p.y+s)){p.y+=s;m-=s}else{
 if(s<0){let ok=0;for(let n=1;n<=4&&!ok;n++)for(const d of[-n,n])if(!hit(p.x+d,p.y+s)){p.x+=d;ok=1;break}if(ok)continue;jumping=false}
 p.vy=0;p.ry=0;break}}}
function camStep(snapNow){const t=Math.max(0,Math.min(LW*T-W,p.x+p.w/2-W/2+p.face*22)),u=Math.max(0,Math.min(LH*T-H,p.y-H/2+10));if(snapNow){cam.x=t;cam.y=u}else{cam.x+=(t-cam.x)*.12;cam.y+=(u-cam.y)*.1}}
function resetRun(toTitle){time=0;deaths=0;got=new Set();snap=new Set();eSnap=new Set();spawn={...SPAWN0};movers.forEach(m=>{m.t=0;m.x=m.ax;m.y=m.ay});parts.length=0;trail.length=0;paused=false;finalMs=0;newIdx=-1;nameBuf='';tsub='main';mode=toTitle?'title':'play';cpFx=null;menuConf=null;fadeA=0;if(toTitle){tsel=0;tsub='main'}if(music)music.volume=mv();respawn();p.face=1;camStep(true);pressed={}}

// ---------- combate ----------
const tone=(f0,f1,d,type='square',v=.12)=>{if(!actx||AU.muted)return;const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);g.gain.setValueAtTime(Math.max(.0001,v*AU.vs/5),t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d)};
function spawnEnemies(){ens.length=0;CROWS.forEach(c=>{if(!ekill.has(c[0]))ens.push({id:c[0],hx:c[1],hy:c[2],x:c[1],y:c[2],hp:3,t:c[0]*37,state:'idle',st:0,cd:50,face:-1,hurt:0})})}
const solidPx=(x,y)=>{const i=Math.floor(x/T),j=Math.floor(y/T);if(i<0||i>=LW)return true;if(j>=0&&j<LH&&grid[j][i])return true;for(const s of statics)if(x>=s.x&&x<s.x+s.w&&y>=s.y&&y<s.y+s.h)return true;for(const s of movers)if(x>=s.x&&x<s.x+s.w&&y>=s.y&&y<s.y+s.h)return true;return false};
function hurt(fx){if(inv>0||dead)return;hp--;tone(240,70,.28,'square',.18);if(hp<=0){die();return}inv=90;stun=14;dashT=0;grab=false;jumping=false;p.vx=(p.x+p.w/2<fx?-1:1)*2.4;p.vy=-2.6;shake=6;burst(p.x+p.w/2,p.y+p.h/2,16,'#e9708f',2,22)}
const ebox=e=>({x:e.x-8,y:e.y-34,w:16,h:34});
function combat(dirx,diry){
 if(atkCd>0)atkCd--;if(atkT>0)atkT--;if(inv>0)inv--;
 if((pressed.KeyX||pressed.KeyK)&&atkCd<=0&&!grab){let ax=dirx,ay=diry;if(!ax&&!ay)ax=p.face;const n=Math.hypot(ax,ay);if(dirx)p.face=dirx;
  bolts.push({x:p.x+p.w/2+ax/n*9,y:p.y+5+ay/n*5,vx:ax/n*3.8,vy:ay/n*3.8,l:55,t:0});atkCd=22;atkT=12;tone(420,1100,.16,'sine',.22);burst(p.x+p.w/2+ax/n*8,p.y+5,8,'#4cc9ff',1.4,14)}
 for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];let gone=false;
  for(let s=0;s<2&&!gone;s++){b.x+=b.vx/2;b.y+=b.vy/2;
   if(solidPx(b.x,b.y)){gone=true;burst(b.x,b.y,8,'#4cc9ff',1.2,12);break}
   for(const e of ens)if(!ekill.has(e.id)&&overl({x:b.x-3,y:b.y-3,w:6,h:6},ebox(e))){e.hp--;e.hurt=10;gone=true;burst(b.x,b.y,10,'#4cc9ff',1.6,14);tone(200,120,.1,'square',.14);
    if(e.hp<=0){ekill.add(e.id);burst(e.x,e.y,28,'#2d3153',2.4,34);burst(e.x,e.y,14,'#6a77b0',2,30);tone(300,40,.4,'sawtooth',.16)}break}
   if(!gone)for(let k=torn.length-1;k>=0;k--){const q=torn[k];if(Math.abs(b.x-q.x)<8&&Math.abs(b.y-q.y)<10){torn.splice(k,1);gone=true;burst(q.x,q.y,12,'#cfeee6',1.6,16);break}}}
  b.t++;if(gone||--b.l<=0)bolts.splice(i,1);else if(tick%2==0)parts.push({x:b.x,y:b.y,vx:0,vy:0,l:10,m:10,c:'#4cc9ff',s:1})}
 const px=p.x+p.w/2,py=p.y+p.h/2;
 for(const e of ens){if(ekill.has(e.id))continue;e.t++;if(e.hurt>0)e.hurt--;
  const dx=px-e.x,dy=py-e.y,d=Math.hypot(dx,dy);e.face=dx>=0?1:-1;
  if(e.state==='idle'){if(e.cd>0)e.cd--;else if(d<200&&Math.abs(dy)<120){e.state='wind';e.st=0}}
  else if(e.state==='wind'){if(e.st%3==0)parts.push({x:e.x+e.face*(e.st<18?9:7),y:e.y-(e.st<18?42:46)+Math.random()*3,vx:(Math.random()-.5)*.5,vy:-.3,l:16,m:16,c:Math.random()<.5?'#cfeee6':'#8fd8cf',s:1});
   if(++e.st===36){const sx=e.x+e.face*27,sy=e.y-36,a=Math.atan2(py-sy,px-sx);torn.push({x:sx,y:sy,vx:Math.cos(a)*1.5,vy:Math.sin(a)*1.5,l:170,t:0});tone(160,320,.3,'sawtooth',.1);burst(sx,sy,10,'#cfeee6',1.6,16);e.state='rec';e.st=0}}
  else if(++e.st>18){e.state='idle';e.cd=100}
  if(overl({x:p.x,y:p.y,w:p.w,h:p.h},ebox(e)))hurt(e.x)}
 for(let i=torn.length-1;i>=0;i--){const q=torn[i];q.x+=q.vx;q.y+=q.vy;q.t++;
  if(--q.l<=0||solidPx(q.x,q.y)){torn.splice(i,1);burst(q.x,q.y,8,'#cfeee6',1,14);continue}
  if(overl({x:p.x,y:p.y,w:p.w,h:p.h},{x:q.x-5,y:q.y-8,w:10,h:16})){hurt(q.x);torn.splice(i,1)}}
}
const PIX=(pat,pal,x,y)=>{pat.forEach((r,j)=>{for(let i=0;i<r.length;i++){const c=pal[r[i]];if(c){ctx.fillStyle=c;ctx.fillRect(Math.round(x)+i,Math.round(y)+j,1,1)}}})};
const ORB=['..aaa..','.abbba.','abcccba','abcccba','abcccba','.abbba.','..aaa..'],ORBP={a:'#2a7fff',b:'#4cc9ff',c:'#e8fbff'},HRT=['.aa.aa.','aaaaaaa','aaaaaaa','.aaaaa.','..aaa..','...a...'];
const OB=['..aaaaa..','.abbbbba.','abbcccbba','abcccccba','abcccccba','abcccccba','abbcccbba','.abbbbba.','..aaaaa..'],OBP={a:'#a9d9cf',b:'#e3f5f1',c:'#ffffff'};
function drawOrb(o){const x=Math.round(o.x),y=Math.round(o.y+Math.sin(tick*.07+o.x)*2.5);
 if(o.cd>0){ctx.globalAlpha=.3;PIX(OB,{a:'#a9d9cf'},x-4,y-4);ctx.globalAlpha=1;return}
 ctx.globalAlpha=.18+.08*Math.sin(tick*.1);ctx.fillStyle='#e3f5f1';for(let j=-8;j<=8;j++)for(let i=-8;i<=8;i++)if(i*i+j*j<=64)ctx.fillRect(x+i,y+j,1,1);ctx.globalAlpha=1;PIX(OB,OBP,x-4,y-4)}
function hearts(){if(!CROWS.length)return;for(let i=0;i<3;i++)PIX(HRT,{a:i<hp?'#e9708f':'#3a3050'},6+i*10,22)}
function drawCombat(){
 for(const e of ens){if(ekill.has(e.id))continue;const fr=e.state==='wind'?(e.st<18?'wizW0':'wizW1'):e.state==='rec'?'wizC':'wizI'+(Math.floor(e.t/32)%2),im=IM[fr];
  ctx.save();ctx.translate(Math.round(e.x),Math.round(e.y));if(e.face<0)ctx.scale(-1,1);if(e.hurt>0&&Math.floor(e.hurt/2)%2)ctx.globalAlpha=.4;ctx.drawImage(im,-26,-56);ctx.restore()}
 for(const q of torn)for(let r=0;r<7;r++){const w=13-r*1.5,x=q.x+Math.sin(q.t*.4+r*.9)*2.5-w/2;ctx.fillStyle=r%2?'#8fd8cf':'#e3f5f1';ctx.fillRect(Math.round(x),Math.round(q.y-8+r*2.3),Math.round(w),2)}
 for(const b of bolts)PIX(ORB,ORBP,b.x-3.5,b.y-3.5)}
let bkC=null;
function buildBackdrop(){
 const c=document.createElement('canvas');c.width=LW*T;c.height=LH*T;const g=c.getContext('2d');
 const bk=Array.from({length:LH},()=>new Uint8Array(LW));
 LEVEL.backdrop.zones.forEach(z=>{for(let j=z[1];j<=z[3];j++)for(let i=z[0];i<=z[2];i++)if(!grid[j][i])bk[j][i]=1});
 const open=(i,j)=>i<0||j<0||i>=LW||j>=LH?false:(!grid[j][i]&&!bk[j][i]);
 for(let j=0;j<LH;j++)for(let i=0;i<LW;i++){if(!bk[j][i])continue;
  const oT=open(i,j-1),oB=open(i,j+1),oL=open(i-1,j),oR=open(i+1,j);
  for(let by=0;by<8;by++)for(let bx=0;bx<8;bx++){let d=9;if(oT)d=Math.min(d,by);if(oB)d=Math.min(d,7-by);if(oL)d=Math.min(d,bx);if(oR)d=Math.min(d,7-bx);
   if(d<4&&hs(i*8+bx,j*8+by)<(4-d)/4.2)continue;
   const q=hs(i*17+bx*3,j*13+by*5);g.fillStyle=q<.08?'#1d5048':q<.3?'#163545':'#0f2230';g.fillRect(i*T+bx*2,j*T+by*2,2,2)}}
 const dm=(sx,sy,w,h,a)=>{const k=document.createElement('canvas');k.width=w;k.height=h;const x=k.getContext('2d');x.drawImage(IM.Tileset,sx,sy,w,h,0,0,w,h);x.globalCompositeOperation='source-atop';x.fillStyle='rgba(8,22,36,'+a+')';x.fillRect(0,0,w,h);return k};
 const tree=dm(196,63,57,64,.5),mush=dm(255,63,50,64,.5),bush=dm(146,105,44,22,.45),vine=dm(16,64,48,33,.35),put=(s,x,y)=>g.drawImage(s,Math.round(x),Math.round(y));
 const SPRS={tree,mush,bush,vine};LEVEL.backdrop.props.forEach(q=>put(SPRS[q[0]],q[1],q[2]));
 
 
 bkC=c}
function respawn(){p.x=spawn.x-p.w/2;p.y=spawn.y-p.h;p.vx=p.vy=p.rx=p.ry=0;dead=false;dashT=0;grab=false;gt=0;wcd=0;airJ=0;dashes=1;lock=0;hp=3;inv=0;stun=0;atkT=0;atkCd=0;orbs.forEach(o=>o.cd=0);bolts.length=0;torn.length=0;ekill=new Set(eSnap);spawnEnemies();got=new Set(snap);trail.length=0}
function die(){if(dead)return;dead=true;dT=0;deaths++;cpFx=null;sfx('morte',.8);shake=7;burst(p.x+p.w/2,p.y+p.h/2,30,'#e9708f',2.4,30);burst(p.x+p.w/2,p.y+p.h/2,14,'#8fd8cf',1.6,24)}
// ---------- simulação ----------
function step(){
 if(pressed.KeyM){AU.muted=!AU.muted;if(music)music.muted=AU.muted}
 if(fadeA>0&&!(menuConf&&menuConf.i===0))fadeA=Math.max(0,fadeA-.05);
 if(mode==='title'){menuStep();pressed={};return}
 if(mode==='name'){pressed={};return}
 if(mode==='board'){if(pressed.Space)resetRun(true);pressed={};return}
 if(pressed.KeyR){resetRun(false);return}
 if(pressed.KeyP||pressed.Escape)paused=!paused;
 if(paused){pressed={};return}
